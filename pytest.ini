[pytest]
# -v: 테스트 이름/결과를 자세히, -s: print()가 있다면 그 출력도 숨기지 않음
# -p no:cacheprovider: .pytest_cache 폴더를 만들지 않음
# --import-mode=importlib: 엔드포인트별 폴더 구조({org} 등 특수문자·중복 basename 허용)
# --alluredir=allure-results: pytest 실행 결과를 Allure 원본 결과 파일로 allure-results 폴더에 저장
# --clean-alluredir는 실행 전에 이전 리포트 파일 삭제 후 생성
# --tb=short: 실패 시 트레이스백을 파일:라인 + assert문 + 에러 메시지 정도로 축약
# --show-capture=no: 실패 리포트에서 Captured stdout/log 재출력(라이브 로그와 중복)을 생략
addopts = -v -s -p no:cacheprovider --import-mode=importlib --alluredir=allure-results --clean-alluredir --tb=short --show-capture=no

# 엔드포인트별로 positive/validation/authentication 패키지명이 반복되므로
# importlib 모드에서도 프로젝트 모듈(config, apis, utils)을 찾을 수 있게 루트를 추가
pythonpath = .

# 테스트를 찾을 경로
testpaths = tests

# 로깅(logging) 설정 - 터미널에는 INFO 이상, 파일에는 DEBUG 이상을 기록
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/api-tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 터미널에서 한글이 유니코드 이스케이프(\uXXXX) 없이 그대로 보이게 함
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# 커스텀 마커 등록 (등록 안 하면 PytestUnknownMarkWarning 발생)
markers =
    api: 실제 Elice API를 호출하는 테스트. RUN_LIVE_API_TESTS=1 없이는 skip됨.
    requires_token: 로그인 access_token이 필요한 API 테스트.
    bug_candidate: 현재 API 동작과 기대 동작 차이를 추적하는 버그 후보 테스트.
    tc: 리포트용 TC 메타데이터 (id, group, title, expected)
    board_authz: 다중 계정이 필요한 Board 권한 경계 테스트.
    board_mutation: 게시글 생성·수정·삭제 등 데이터를 변경하는 Board 테스트.

